name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Database tests run only when the DATABASE_URL secret is set. Without it, the
      # audit and app-role tests skip and the rest of the suite still runs.
      - name: Test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm test
